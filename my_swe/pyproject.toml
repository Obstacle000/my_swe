[project]
name = "my-swe-rca-agent"
version = "0.1.0"
description = "基于 LangGraph 多智能体与多源证据链的微服务故障根因分析 (RCA) 与代码自愈平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.5",
    "langgraph>=0.2.45",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "elasticsearch>=8.15.0",
    "qdrant-client>=1.12.0",
    "redis>=5.1.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
