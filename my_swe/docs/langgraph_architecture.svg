<svg viewBox="0 0 1240 940" width="1240" height="940" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4" />
    </marker>
  </defs>

  <!-- Dark Background -->
  <rect x="0" y="0" width="1240" height="940" fill="#0b1120" />

  <!-- Outer Frame: IncidentMainState -->
  <rect x="14" y="14" width="1212" height="912" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="32" y="40" fill="#60a5fa" font-size="14" font-weight="bold">
    主图: main_incident_graph | State: IncidentMainState (Checkpointer: thread_id = incident_id)
  </text>

  <!-- Runtime[IncidentGraphContext] Banner (DI Context) -->
  <rect x="640" y="22" width="568" height="32" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
  <text x="924" y="43" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="bold">
    Runtime[IncidentGraphContext] 注入: incident_repo / runbook_repo / mall_probe_repo / es_repo / qdrant_repo / embedding
  </text>

  <!-- ==================== ROW 1: START -> triage_node -> crag_subgraph_node -> hypothesis_planner_node ==================== -->
  <!-- START -->
  <circle cx="58" cy="122" r="22" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="58" y="126" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">START</text>
  <line x1="80" y1="122" x2="112" y2="122" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Node 1: triage_node -->
  <rect x="116" y="88" width="175" height="68" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="203" y="112" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">1. triage_node</text>
  <text x="203" y="131" text-anchor="middle" fill="#93c5fd" font-size="12">读: user_query / messages</text>
  <text x="203" y="147" text-anchor="middle" fill="#94a3b8" font-size="12">写: extracted_clues, loop=0</text>

  <line x1="291" y1="122" x2="328" y2="122" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- Node 2 & Subgraph 1: crag_subgraph_node (CRAGSubState) -->
  <rect x="332" y="64" width="560" height="146" rx="10" fill="#2e1065" fill-opacity="0.32" stroke="#a855f7" stroke-width="2" />
  <text x="348" y="85" fill="#d8b4fe" font-size="12" font-weight="bold">
    2. crag_subgraph_node ──► 子图 1: crag_subgraph (CRAGSubState, 透传 runtime.context)
  </text>

  <!-- Sub1 Node A: hybrid_retrieve_node -->
  <rect x="346" y="98" width="144" height="58" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
  <text x="418" y="119" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">hybrid_retrieve_node</text>
  <text x="418" y="136" text-anchor="middle" fill="#c084fc" font-size="12">ES(BM25) + Qdrant(Vec)</text>
  <text x="418" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">rrf_fuse_runbooks(k=60)</text>

  <line x1="490" y1="127" x2="518" y2="127" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" />

  <!-- Sub1 Node B: grade_docs_node -->
  <polygon points="572,95 626,127 572,159 518,127" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
  <text x="572" y="124" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">grade_docs</text>
  <text x="572" y="139" text-anchor="middle" fill="#d8b4fe" font-size="12">相关吗?</text>

  <!-- Sub1 Node C: rewrite_query_node -->
  <line x1="626" y1="127" x2="656" y2="127" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="641" y="119" text-anchor="middle" fill="#f87171" font-size="12">无</text>
  <rect x="660" y="102" width="110" height="50" rx="6" fill="#1e1b4b" stroke="#f87171" stroke-width="1.5" />
  <text x="715" y="123" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">rewrite_query</text>
  <text x="715" y="140" text-anchor="middle" fill="#fca5a5" font-size="12">retry_count &lt; 1</text>
  <path d="M 715 152 L 715 194 L 418 194 L 418 156" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="566" y="188" text-anchor="middle" fill="#fca5a5" font-size="12">改写 current_query 重搜</text>

  <!-- Sub1 Node D: pack_output_node -->
  <path d="M 572 95 L 572 78 L 830 78 L 830 100" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <rect x="780" y="102" width="98" height="50" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" />
  <text x="829" y="123" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">pack_output</text>
  <text x="829" y="140" text-anchor="middle" fill="#cbd5e1" font-size="12">签发 [ev_hist]</text>

  <!-- CRAG -> Node 3: hypothesis_planner_node -->
  <line x1="892" y1="127" x2="934" y2="127" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="913" y="116" text-anchor="middle" fill="#34d399" font-size="12">写回</text>

  <rect x="938" y="86" width="265" height="78" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="1070" y="110" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">3. hypothesis_planner_node</text>
  <text x="1070" y="129" text-anchor="middle" fill="#93c5fd" font-size="12">读: extracted_clues, crag_hit, historical_context</text>
  <text x="1070" y="147" text-anchor="middle" fill="#94a3b8" font-size="12">写: hypotheses (1~3个), loop_count += 1</text>

  <!-- ==================== ROW 2: Send API -> probe_worker_node (Subgraph 2: ProbeWorkerState) ==================== -->
  <path d="M 1070 164 L 1070 236 L 230 236 L 230 278" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-green)" />
  <path d="M 1070 164 L 1070 236 L 620 236 L 620 278" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-green)" />
  <path d="M 1070 164 L 1070 236 L 1005 236 L 1005 278" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-green)" />
  <rect x="455" y="222" width="330" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="620" y="238" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">
    _dispatch_probe_workers: Send("probe_worker_node", ProbeWorkerState)
  </text>

  <!-- Subgraph 2 Outer Box -->
  <rect x="44" y="262" width="1158" height="175" rx="10" fill="#064e3b" fill-opacity="0.22" stroke="#10b981" stroke-width="2" />
  <text x="62" y="284" fill="#34d399" font-size="12" font-weight="bold">
    4. probe_worker_node × N ──► 子图 2: probe_subgraph (ProbeWorkerState: probe_agent_node ⇄ probe_tool_node | 私有 worker_messages 隔离，remaining_chars=15000)
  </text>

  <!-- Worker 1: Log Probe -->
  <rect x="68" y="300" width="340" height="118" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="238" y="323" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">并行实例 A: 日志探针 (probe_type == "log")</text>
  <text x="238" y="344" text-anchor="middle" fill="#cbd5e1" font-size="12">挂载 LOG_TOOLS: search_error_logs / get_trace_logs</text>
  <text x="238" y="364" text-anchor="middle" fill="#67e8f9" font-size="12">执行: runtime.context["runtime_log_es_repo"]</text>
  <text x="238" y="384" text-anchor="middle" fill="#94a3b8" font-size="12">拦截器: redact_text() 脱敏 + 签发 [ev_log:xxxx]</text>
  <text x="238" y="404" text-anchor="middle" fill="#fca5a5" font-size="12">超预算/报错 -> 自动记入 gaps</text>

  <!-- Worker 2: Code Probe -->
  <rect x="450" y="300" width="340" height="118" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="620" y="323" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">并行实例 B: 代码探针 (probe_type == "code")</text>
  <text x="620" y="344" text-anchor="middle" fill="#cbd5e1" font-size="12">挂载 CODE_TOOLS: list_repo_files / grep / read_file / git_blame</text>
  <text x="620" y="364" text-anchor="middle" fill="#67e8f9" font-size="12">执行: 本地靶场源码只读窗口与 Git 历史检查</text>
  <text x="620" y="384" text-anchor="middle" fill="#94a3b8" font-size="12">拦截器: redact_text() 脱敏 + 签发 [ev_code:xx] / [ev_git:xx]</text>
  <text x="620" y="404" text-anchor="middle" fill="#fca5a5" font-size="12">worker_messages 出子图即销毁，不污染主图 messages</text>

  <!-- Worker 3: DB Probe -->
  <rect x="832" y="300" width="345" height="118" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="1004" y="323" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">并行实例 C: 数据库探针 (probe_type == "db")</text>
  <text x="1004" y="344" text-anchor="middle" fill="#cbd5e1" font-size="12">挂载 DB_TOOLS: inspect_table_schema / execute_readonly_sql</text>
  <text x="1004" y="364" text-anchor="middle" fill="#67e8f9" font-size="12">执行: runtime.context["mall_probe_repo"] (MySQL AsyncSession)</text>
  <text x="1004" y="384" text-anchor="middle" fill="#94a3b8" font-size="12">拦截器: 只读 SELECT 安全校验 + 签发 [ev_db:xxxx]</text>
  <text x="1004" y="404" text-anchor="middle" fill="#fca5a5" font-size="12">核查 NULL 脏数据与订单状态</text>

  <!-- ==================== ROW 3: operator.add Merge -> evidence_evaluate_node ==================== -->
  <path d="M 238 418 L 238 468 L 415 468" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 620 418 L 620 468 L 570 468" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 1004 418 L 1004 468 L 570 468" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="790" y="460" fill="#34d399" font-size="12" font-weight="bold">
    Annotated[list[Evidence], operator.add] &amp; Annotated[list[str], operator.add] 规避并行写冲突，自动归并 evidence 与 gaps
  </text>

  <!-- Node 5: evidence_evaluate_node -->
  <rect x="355" y="472" width="235" height="62" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="472" y="497" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">5. evidence_evaluate_node</text>
  <text x="472" y="518" text-anchor="middle" fill="#93c5fd" font-size="12">汇聚去重并行探针采集的真实证据池</text>

  <line x1="355" y1="503" x2="262" y2="503" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Diamond: _route_after_evaluate -->
  <polygon points="188,466 262,503 188,540 114,503" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
  <text x="188" y="499" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">evidence 非空?</text>
  <text x="188" y="515" text-anchor="middle" fill="#93c5fd" font-size="12">或 loop &gt;= 2</text>

  <!-- Loop back to hypothesis_planner_node if empty and loop_count < 2 -->
  <path d="M 114 503 L 26 503 L 26 216 L 1070 216 L 1070 164" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)" />
  <text x="68" y="492" fill="#fbbf24" font-size="12">为空且 loop_count &lt; 2: 回规划节点重提假设</text>

  <!-- ==================== ROW 4: generate_report_node -> verify_report_node -> _route_after_verify ==================== -->
  <line x1="188" y1="540" x2="188" y2="594" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="225" y="572" fill="#34d399" font-size="12">证据充足</text>

  <!-- Node 6: generate_report_node -->
  <rect x="72" y="598" width="232" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="188" y="622" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">6. generate_report_node</text>
  <text x="188" y="641" text-anchor="middle" fill="#93c5fd" font-size="12">输出结构化草稿 ReportDraft</text>
  <text x="188" y="658" text-anchor="middle" fill="#94a3b8" font-size="12">每条 Claim 强制绑定 evidence_ids</text>

  <line x1="304" y1="634" x2="352" y2="634" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- Node 7: verify_report_node -->
  <rect x="356" y="592" width="256" height="84" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2" />
  <text x="484" y="616" text-anchor="middle" fill="#fda4af" font-size="13" font-weight="bold">7. verify_report_node (防幻觉验钞)</text>
  <text x="484" y="635" text-anchor="middle" fill="#f8fafc" font-size="12">valid_refs 核对 State["evidence"] 白名单</text>
  <text x="484" y="652" text-anchor="middle" fill="#cbd5e1" font-size="12">+ SHA-256 指纹 (digest) + 生成 AIMessage</text>
  <text x="484" y="668" text-anchor="middle" fill="#6ee7b7" font-size="12">通过 -> 写入 final_report (IncidentReport)</text>

  <!-- Reject Loop: verify_report_node -> generate_report_node -->
  <path d="M 484 676 L 484 712 L 188 712 L 188 670" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="336" y="704" text-anchor="middle" fill="#f87171" font-size="12">
    发现伪造/缺失 evidence_id: 写入 verification_error &amp; gaps 打回重写 (verify_retry_count &lt; 2)
  </text>

  <!-- Diamond: need_code_patch? -->
  <line x1="612" y1="634" x2="652" y2="634" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <polygon points="712,596 772,634 712,672 652,634" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="712" y="630" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">need_code</text>
  <text x="712" y="646" text-anchor="middle" fill="#6ee7b7" font-size="12">_patch?</text>

  <!-- Branch A: need_code_patch == True -> Subgraph 3 (patch_subgraph_node) -->
  <line x1="772" y1="634" x2="812" y2="634" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />
  <text x="792" y="624" text-anchor="middle" fill="#fbbf24" font-size="12">True</text>

  <!-- Node 8 & Subgraph 3: patch_subgraph_node (PatchSelfHealSubState) -->
  <rect x="816" y="542" width="388" height="205" rx="10" fill="#78350f" fill-opacity="0.26" stroke="#f59e0b" stroke-width="2" />
  <text x="832" y="564" fill="#fbbf24" font-size="12" font-weight="bold">
    8. patch_subgraph_node ──► 子图 3: patch_subgraph
  </text>
  <text x="832" y="581" fill="#fde68a" font-size="12">
    (PatchSelfHealSubState: 隔离沙箱修复与 pytest 自愈闭环)
  </text>

  <!-- Sub3 Node 1: init_worktree_node -->
  <rect x="832" y="594" width="110" height="54" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
  <text x="887" y="617" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">init_worktree</text>
  <text x="887" y="635" text-anchor="middle" fill="#fcd34d" font-size="12">.sandboxes/副本</text>

  <line x1="942" y1="621" x2="966" y2="621" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)" />

  <!-- Sub3 Node 2: generate_patch_node -->
  <rect x="970" y="594" width="112" height="54" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1026" y="617" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">generate_patch</text>
  <text x="1026" y="635" text-anchor="middle" fill="#fcd34d" font-size="12">生成 patch_diff</text>

  <line x1="1082" y1="621" x2="1104" y2="621" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-amber)" />

  <!-- Sub3 Node 3: run_pytest_node -->
  <rect x="1108" y="594" width="82" height="54" rx="6" fill="#1c1917" stroke="#10b981" stroke-width="1.5" />
  <text x="1149" y="617" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold">run_pytest</text>
  <text x="1149" y="635" text-anchor="middle" fill="#cbd5e1" font-size="12">跑真实单测</text>

  <!-- Sub3 Self-Heal Loop -->
  <path d="M 1149 648 L 1149 710 L 1026 710 L 1026 648" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  <text x="1088" y="728" text-anchor="middle" fill="#fca5a5" font-size="12">
    单测失败: 携 pytest_output 回环自愈 (retry_count &lt; 3)
  </text>

  <!-- Branch B: need_code_patch == False -> human_approval_node directly -->
  <path d="M 712 672 L 712 805 L 540 805" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)" />
  <text x="635" y="795" text-anchor="middle" fill="#67e8f9" font-size="12">False (配置/外部网关问题，跳过改代码)</text>

  <!-- Subgraph 3 -> Node 9: human_approval_node -->
  <path d="M 960 747 L 960 772 L 415 772 L 415 802" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="690" y="766" text-anchor="middle" fill="#34d399" font-size="12">写回 patch_diff &amp; test_passed</text>

  <!-- ==================== ROW 5: human_approval_node (HITL) -> apply_and_evolve_node -> END ==================== -->
  <!-- Node 9: human_approval_node -->
  <rect x="275" y="805" width="265" height="78" rx="8" fill="#31102f" stroke="#ec4899" stroke-width="2" />
  <text x="407" y="829" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="bold">9. human_approval_node (HITL)</text>
  <text x="407" y="848" text-anchor="middle" fill="#fbcfe8" font-size="12">调用 interrupt() 挂起图状态并落库</text>
  <text x="407" y="866" text-anchor="middle" fill="#f9a8d4" font-size="12">等待 Command(resume={decision, feedback})</text>

  <!-- Reject Loop from HITL back to patch_subgraph_node -->
  <path d="M 407 883 L 407 908 L 1214 908 L 1214 685 L 1204 685" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-red)" />
  <text x="810" y="901" text-anchor="middle" fill="#f87171" font-size="12">
    human_approval == "rejected" 且 need_code_patch: 携带 human_feedback 打回 patch_subgraph_node 重写补丁
  </text>

  <line x1="540" y1="844" x2="625" y2="844" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="582" y="834" text-anchor="middle" fill="#34d399" font-size="12">approved</text>

  <!-- Node 10: apply_and_evolve_node -->
  <rect x="630" y="800" width="440" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="850" y="824" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="bold">10. apply_and_evolve_node (经验自进化归档)</text>
  <text x="850" y="844" text-anchor="middle" fill="#67e8f9" font-size="12">通过 runtime.context 注入的仓储依次三库同步:</text>
  <text x="850" y="863" text-anchor="middle" fill="#cbd5e1" font-size="12">① MySQL runbook_repo (唯一事实源) ➔ ② ES runbook_es_repo ➔ ③ Qdrant runbook_qdrant_repo</text>

